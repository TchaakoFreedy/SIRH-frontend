<!-- forgot-password.component.html -->
<div class="forgot-container">
  <div class="forgot-card">
    <div class="forgot-header">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <h2>Mot de passe oublié</h2>
      <p class="subtitle">Entrez votre adresse email pour recevoir un code de réinitialisation</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="forgot-form">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input 
            type="email" 
            id="email"
            formControlName="email" 
            placeholder="exemple@email.com"
            [class.error-input]="form.get('email')?.invalid && form.get('email')?.touched"
          />
        </div>
        <span class="error-message" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Veuillez entrer une adresse email valide
        </span>
      </div>

      <button 
        type="submit" 
        [disabled]="loading() || form.invalid"
        class="submit-btn"
        [class.loading]="loading()"
      >
        <span *ngIf="!loading()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
          Envoyer le code
        </span>
        <span *ngIf="loading()" class="spinner">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
          Envoi en cours...
        </span>
      </button>

      <div class="success-message" *ngIf="success()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; flex-shrink: 0;">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        {{ success() }}
      </div>

      <div class="error-message-container" *ngIf="error()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; flex-shrink: 0;">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error() }}
      </div>
    </form>

    <div class="forgot-footer">
      <a routerLink="/login" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Retour à la connexion
      </a>
    </div>
  </div>
</div>
