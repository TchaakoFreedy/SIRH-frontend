<div class="notification-icon-wrapper" (click)="toggleDropdown($event)">
  <div class="icon-container" [class.has-notifications]="unreadCount > 0">
    <!-- Icône cloche SVG -->
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
  </div>

  <!-- Dropdown -->
  <div class="dropdown-menu" *ngIf="showDropdown" (click)="$event.stopPropagation()">
    <div class="dropdown-header">
      <span class="dropdown-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        Notifications
      </span>
      <button class="mark-all-btn" (click)="markAllAsRead($event)" *ngIf="unreadCount > 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        Tout lire
      </button>
    </div>

    <div class="dropdown-body">
      <!-- État vide -->
      <div *ngIf="recentNotifications.length === 0" class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <p>Aucune notification</p>
        <span class="empty-sub">Les nouvelles notifications apparaîtront ici</span>
      </div>

      <!-- Liste -->
      <div *ngFor="let notif of recentNotifications" 
           class="notification-item" 
           [class.unread]="!notif.read"
           routerLink="/notifications">
        <!-- Icône de type -->
        <div class="notification-icon" [class]="'bg-' + getColorForType(notif.type)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path *ngIf="getIconForType(notif.type) === 'check_circle'" d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <path *ngIf="getIconForType(notif.type) === 'info'" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path *ngIf="getIconForType(notif.type) === 'warning'" d="M12 9v4m0 4h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z" />
            <path *ngIf="getIconForType(notif.type) === 'error'" d="M12 9v4m0 4h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z" />
            <path *ngIf="!['check_circle','info','warning','error'].includes(getIconForType(notif.type))" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <!-- Contenu -->
        <div class="notification-content">
          <div class="notification-title">{{ notif.title }}</div>
          <div class="notification-message">{{ notif.message }}</div>
          <div class="notification-meta">{{ formatDate(notif.createdAt) }}</div>
        </div>
        <!-- Bouton marquer comme lu -->
        <button class="mark-read-btn" 
                *ngIf="!notif.read"
                (click)="markAsRead(notif.id, $event)"
                title="Marquer comme lu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </button>
      </div>
    </div>

    <div class="dropdown-footer">
      <a routerLink="/notifications" class="view-all-link">
        Voir toutes les notifications
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </a>
    </div>
  </div>
</div>
